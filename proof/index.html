<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>IRX — Pass D: warm hinge</title>
  <style>
    :root { box-sizing: border-box; }
    * { box-sizing: inherit; }
    html,body { margin:0; background:#07080A; }
    #pin { position: fixed; inset: 0; overflow: hidden; }
    #track { height: 900vh; }
    body.reduced #track { height: 100vh; }
    #beat { position:fixed; left:10px; bottom:10px; z-index:9; color:#E9E9E4;
      font:11px/1.4 ui-monospace,monospace; background:rgba(0,0,0,.55);
      padding:5px 9px; border-radius:5px; letter-spacing:.04em; }
    .band { will-change: transform; }
    /* The choice belongs to the world: no card, no panel, no dashboard.
       Type on the room, and the room stays visible behind it. */
    #choice { position:fixed; left:0; right:0; bottom:9vh; z-index:8;
      display:none; flex-direction:column; align-items:center; gap:14px;
      font-family: ui-monospace, monospace; }
    #choice.on { display:flex; }
    #choice .q { margin:0 0 4px; color:#E9E9E4; font-size:13px; letter-spacing:.18em;
      text-transform:uppercase; opacity:.72;
      text-shadow:0 2px 14px rgba(0,0,0,.9); }
    #choice button { background:none; border:0; cursor:pointer; padding:6px 10px;
      color:#F2C77E; font:400 27px/1.25 Georgia, serif;
      letter-spacing:.01em; text-shadow:0 2px 18px rgba(0,0,0,.95);
      opacity:.88; transition:opacity .18s, transform .18s; }
    #choice button:hover { opacity:1; transform:translateY(-1px); }
  </style></head>
<body>
<div id="pin"></div>
<div id="track"></div>
<div id="beat"></div>
<script type="module" src="./bundle.js"></script>
</body></html>
