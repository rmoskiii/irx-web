<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>IRX — Pass B camera proof</title>
<style>
  :root { box-sizing: border-box; }
  * { box-sizing: inherit; }
  html,body { margin:0; background:#07080A; }
  #pin { position: fixed; inset: 0; overflow: hidden; }
  #stage { width:100%; height:100%; display:block; }
  #atmosphere { position:absolute; inset:0; pointer-events:none; }
  #atmosphere svg { width:100%; height:100%; }
  #track { height: 600vh; }
  body.reduced #track { height: 100vh; }
  #beat { position:fixed; left:10px; bottom:10px; z-index:5; color:#E9E9E4;
          font:11px/1.4 ui-monospace,monospace; background:rgba(0,0,0,.55);
          padding:5px 9px; border-radius:5px; letter-spacing:.04em; }
  .band { will-change: transform; }
</style></head>
<body>
  <div id="pin">
    <svg id="stage" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <g id="world"></g>
    </svg>
    <div id="atmosphere"><svg xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>
  <div id="track"></div>
  <div id="beat"></div>
  <script type="module" src="./bundle.js"></script>
</body></html>
